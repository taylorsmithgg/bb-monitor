name: monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install the driver
        run: |
          bun add patchright
          bunx patchright install chrome --with-deps || bunx patchright install chromium --with-deps
      - name: Read the drop pages
        run: xvfb-run --auto-servernum bun monitor.ts
      - name: Publish the state
        run: |
          git config user.name "monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add state.json
          git commit -m "Update monitor state [skip ci]" || exit 0
          git push
